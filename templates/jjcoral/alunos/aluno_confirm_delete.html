{% extends "base.html" %}

{% block title %}Excluir Aluno{% endblock %}

{% block content %}

<h2 class="mb-4 text-danger">Excluir Aluno</h2>

<div class="card p-4">

    <p>Tem certeza que deseja excluir o aluno <strong>{{ aluno.nome }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sim, excluir</button>
        <a href="{% url 'jjcoral:aluno_lista' %}" class="btn btn-secondary">Cancelar</a>
    </form>

</div>

{% endblock %}

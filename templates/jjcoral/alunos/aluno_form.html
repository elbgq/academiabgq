{% extends "base.html" %}

{% block title %}Cadastro de Aluno{% endblock %}

{% block content %}

<h2 class="mb-4">Cadastro de Aluno</h2>

<div class="card p-4">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'jjcoral:aluno_lista' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

{% endblock %}

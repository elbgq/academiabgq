{% extends "base.html" %}

{% block title %}Detalhes da Faixa{% endblock %}

{% block content %}

<h2 class="mb-4">{{ faixa.nome }}</h2>

<div class="card p-4">
    <p><strong>Nível:</strong> {{ faixa.nivel }}</p>

    <hr>

    <a href="{% url 'jjcoral:faixa_editar' faixa.pk %}" class="btn btn-primary">Editar</a>
    <a href="{% url 'jjcoral:faixa_lista' %}" class="btn btn-secondary">Voltar</a>
</div>

{% endblock %}

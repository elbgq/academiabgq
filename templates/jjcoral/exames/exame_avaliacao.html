{% extends "base.html" %}

{% block title %}Avaliação{% endblock %}

{% block content %}
<h2 class="mb-4">Avaliação — {{ aluno.nome }}</h2>

<div class="card p-4">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">Salvar Avaliação</button>
        <a href="{% url 'jjcoral:exame_inscricoes' exame.pk %}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
{% endblock %}

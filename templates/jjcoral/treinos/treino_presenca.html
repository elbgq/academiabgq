{% extends "base.html" %}

{% block title %}Presença{% endblock %}

{% block content %}
<h2 class="mb-4">Presença — {{ treino.turma.nome }} ({{ treino.data }})</h2>

<div class="card p-4">
    <form method="post">
        {% csrf_token %}

        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Aluno</th>
                    <th>Presente?</th>
                </tr>
            </thead>
            <tbody>
                {% for aluno in alunos %}
                <tr>
                    <td>{{ aluno.nome }}</td>
                    <td>
                        <input type="checkbox" name="presenca_{{ aluno.pk }}">
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <button type="submit" class="btn btn-primary">Salvar Presença</button>
        <a href="{% url 'jjcoral:treino_lista' %}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
{% endblock %}
